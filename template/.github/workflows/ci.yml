name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    # ubuntu, with no Dota 2 anywhere in sight. `scripts/install.js` runs as
    # postinstall and only ever reports what it found — linking is the explicit
    # `bun run link` — so everything below runs anywhere: real CI for a Valve
    # game mod.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p src/vscripts/tsconfig.json
      - run: bunx tsc --noEmit -p src/panorama/tsconfig.json
      - run: bun run build
      - run: bunx vitest run --passWithNoTests
